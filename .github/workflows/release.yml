name: Build & Release Addon

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create ZIP
        run: |
          zip -r SmartAssist.zip SmartAssist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: SmartAssist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}